# docker-compose.yml
services:
  backend:
    build: 
      context: ./backend
    container_name: snip_backend
    restart: always
    volumes:
      - ./snip_data:/app/data

  frontend:
    build: 
      context: ./frontend
    container_name: snip_frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      # 命令行客户端，通过 http://HOST:8080/cli/snip.py 下载
      - ./cli:/usr/share/nginx/html/cli:ro
    depends_on:
      - backend

volumes:
  snip_data: