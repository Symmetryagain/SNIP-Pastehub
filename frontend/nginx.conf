# frontend/nginx.conf
server {
    listen 80;

    # 允许上传较大的剪切板内容（nginx 默认只有 1m）
    client_max_body_size 10m;

    # 1. 托管 Vue 静态文件
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 这是 Vue Router (History 模式) 的命脉，找不到文件就返回 index.html
        try_files $uri $uri/ /index.html; 
    }

    # 2. 命令行客户端下载：curl -fsSL http://HOST:8080/cli/snip.py -o snip
    #    文件来自 docker-compose 挂载的 ./cli 目录
    location /cli/ {
        root /usr/share/nginx/html;
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
    }

    # 3. 将 /api 的请求转发给后端的 8000 端口
    # 注意这里 proxy_pass 的 backend 是我们在 docker-compose 里定义的服务名
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}